          maximum: 5.0
        quality_rating:
          type: number
          format: float
          minimum: 1.0
          maximum: 5.0
        timeliness_rating:
          type: number
          format: float
          minimum: 1.0
          maximum: 5.0
        would_recommend:
          type: boolean
        would_hire_again:
          type: boolean
