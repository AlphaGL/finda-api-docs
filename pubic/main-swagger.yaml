          type: string
          example: "john_doe"
        rating:
          type: number
          format: float
          minimum: 1.0
          maximum: 5.0
          example: 4.5
        review_title:
          type: string
          example: "Great product!"
        review:
          type: string
          example: "This product exceeded my expectations"
        pros:
          type: string
          example: "Fast delivery, good quality"
        cons:
          type: string
          example: "Packaging could be better"
        would_recommend:
          type: boolean
          example: true
        is_verified_purchase:
          type: boolean
          example: true
        helpful_count:
          type: integer
          example: 5
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductRatingRequest:
      type: object
      required:
        - rating
      properties:
        rating:
          type: number
          format: float
          minimum: 1.0
          maximum: 5.0
          example: 4.5
        review_title:
          type: string
          maxLength: 200
          example: "Excellent product"
        review:
          type: string
          maxLength: 1000
          example: "Very satisfied with this purchase"
        pros:
          type: string
          maxLength: 500
        cons:
          type: string
          maxLength: 500
        would_recommend:
          type: boolean
          default: true

    ServiceRating:
