          type: object
          properties:
            product_ratings:
              type: array
              items:
                type: object
                properties:
                  product__product_name:
                    type: string
                  rating:
                    type: number
                  review:
                    type: string
                  created_at:
                    type: string
                    format: date-time
            service_ratings:
              type: array
              items:
                type: object
                properties:
                  service__service_name:
                    type: string
                  rating:
                    type: number
                  review:
                    type: string
                  created_at:
                    type: string
                    format: date-time

    # ===========================
    #  UTILITY SCHEMAS
    # ===========================
    User:
      type: object
      properties:
        id:
          type: integer
          example: 123
        username:
          type: string
          example: "john_doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        first_name:
          type: string
          example: "John"
        last_name:
          type: string
          example: "Doe"
        full_name:
          type: string
          example: "John Doe"

    ValidationError:
      type: object
      properties:
        field_name:
          type: array
          items:
            type: string
          description: List of validation errors for the field
          example: ["This field is required."]
      additionalProperties:
        type: array
        items:
          type: string
      example:
        product_name: ["Product name must be at least 3 characters long."]
        product_price: ["Price must be greater than zero."]
        country: ["Invalid location hierarchy."]

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid request parameters"
        detail:
          type: string
          description: Detailed error description
          example: "The provided location hierarchy is invalid"