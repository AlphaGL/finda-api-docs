    # ===========================
    BulkOperationRequest:
      type: object
      required:
        - action
        - item_type
        - item_ids
      properties:
        action:
          type: string
          enum: [delete, publish, draft, feature, unfeature]
          example: "publish"
        item_type:
          type: string
          enum: [products, services]
          example: "products"
        item_ids:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 1
          maxItems: 100
          example: [1, 2, 3, 4, 5]

    ExportData:
      type: object
      properties:
        exported_at:
          type: string
          format: date-time
        user:
          type: string
        products:
          type: array
          items:
            type: object
            properties:
              product_name:
                type: string
              product_description:
                type: string
              product_price:
                type: number
              product_condition:
                type: string
              product_status:
                type: string
              created_at:
                type: string
                format: date-time
              category__name:
                type: string
              country__name:
                type: string
              state__name:
                type: string
              city__name:
                type: string
        services:
          type: array
          items:
