        - rating
      properties:
        rating:
          type: number
          format: float
          minimum: 1.0
          maximum: 5.0
        review_title:
          type: string
          maxLength: 200
        review:
          type: string
          maxLength: 1000
        communication_rating:
          type: number
          format: float
          minimum: 1.0
          maximum: 5.0
        quality_rating:
          type: number
          format: float
          minimum: 1.0
          maximum: 5.0
        timeliness_rating:
          type: number
          format: float
          minimum: 1.0
          maximum: 5.0
        would_recommend:
          type: boolean
          default: true
        would_hire_again:
          type: boolean
          default: true

    # ===========================
    #  SEARCH & PAGE SCHEMAS
    # ===========================
    HomePageResponse:
      type: object
      properties:
        promoted_products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        promoted_services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        filter_options:
          type: object
          properties:
            countries:
              type: array
              items:
                $ref: '#/components/schemas/Country'
            categories:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  icon:
                    type: string
        applied_filters:
          type: object
          properties:
            search:
              type: string
            category:
              type: string
            country:
              type: string
            state:
              type: string
            city:
              type: string
            min_rating:
              type: string
            max_price:
              type: string
        total_results:
          type: object
          properties:
            products:
              type: integer
            services:
              type: integer

    SearchResponse:
      type: object
      properties:
        results:
          type: object
          properties:
            products:
              type: array
              items:
                $ref: '#/components/schemas/Product'
            services:
              type: array
              items:
                $ref: '#/components/schemas/Service'
        query:
          type: string
        filters_applied:
          type: object
          properties:
            category:
              type: string
            location:
              type: string
            price_range:
              type: array
              items:
                type: number
              nullable: true
            min_rating:
              type: number
              nullable: true

    # ===========================
    #  PAYMENT SCHEMAS
    # ===========================
    PaymentInitiateRequest:
      type: object
      properties:
        product_id:
          type: integer
          example: 123
          description: Product to pay for (either product_id or service_id required)
        service_id:
          type: integer
          example: 456
          description: Service to pay for (either product_id or service_id required)
      oneOf:
        - required: [product_id]
        - required: [service_id]

    PaymentInitiateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Payment initialized successfully"
        data:
          type: object
          properties:
            authorization_url:
              type: string
              format: uri
              example: "https://checkout.paystack.com/abc123"
            reference:
              type: string
              example: "abc123def456"
            amount:
              type: number
              example: 1000
            item_name:
              type: string
              example: "Product Listing Fee - iPhone 14"
            item_type:
              type: string
              enum: [product, service]
            order_id:
              type: integer
              example: 123
            callback_url:
              type: string
              format: uri

    PaymentVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Product payment successful. Your product is now listed."
        data:
          type: object
          properties:
            item_type:
              type: string
              enum: [product, service]
            item_id:
              type: integer
            item_name:
              type: string
            amount_paid:
              type: number
            status:
              type: string
              example: "published"
            reference:
              type: string
            published_at:
              type: string
              format: date-time

    PaymentStatusResponse:
      type: object
      properties:
        item_type:
          type: string
          enum: [product, service]
        item_id:
          type: integer
        item_name:
          type: string
        is_paid:
          type: boolean
        status:
          type: string
        is_promoted:
          type: boolean
        promotion_fee:
          type: number
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    PaymentHistoryResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            total_payments:
              type: integer
            total_products_paid:
              type: integer
            total_services_paid:
              type: integer
            total_amount_paid:
              type: number
            base_listing_fee:
              type: number
              example: 1000
        paid_products:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              product_name:
                type: string
              product_status:
                type: string
              is_promoted:
                type: boolean
              promotion_fee:
                type: number
              published_at:
                type: string
                format: date-time
              created_at:
                type: string
                format: date-time
        paid_services:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              service_name:
                type: string
              service_status:
                type: string
              is_promoted:
                type: boolean
              promotion_fee:
                type: number
              published_at:
                type: string
                format: date-time
              created_at:
                type: string
                format: date-time

    PromotionPaymentRequest:
      type: object
      required:
        - item_type
        - item_id
      properties:
        item_type:
          type: string
          enum: [product, service]
          example: "product"
        item_id:
          type: integer
          minimum: 1
          example: 123
        promotion_duration:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
          description: "Promotion duration in days (1-365)"
          example: 30

    PromotionPaymentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Promotion payment initialized successfully"
        data:
          type: object
          properties:
            authorization_url:
              type: string
              format: uri
            reference:
              type: string
            amount:
              type: number
              example: 1500
            item_name:
              type: string
              example: "Promotion Fee - iPhone 14"
            promotion_duration:
              type: integer
              example: 30
            daily_rate:
              type: number
              example: 50

